name: Revisión nocturna de recursos (3 veces por semana)

on:
  schedule:
    # 03:17 UTC, de noche en Chile (23:17 o 00:17 según horario estacional).
    - cron: "17 3 * * 2,4,6"
  workflow_dispatch:

concurrency:
  group: weekly-resources
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESOURCE_REPORT: /tmp/resource-update-report.json
      GH_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Registrar versión oficial de partida
        shell: bash
        run: echo "AUTOMATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Reestructurar, importar, actualizar, auditar y compilar
        run: npm run resources:sync -- --report "$RESOURCE_REPORT" --no-install --defer-assisted

      - name: Guardar informe de ejecución
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-update-report
          path: ${{ env.RESOURCE_REPORT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Detectar cambios reales
        id: changes
        shell: bash
        run: |
          TASK_COUNT=$(python3 -c 'import json, os; print(len(json.load(open(os.environ["RESOURCE_REPORT"], encoding="utf-8")).get("tasks", [])))')
          echo "tasks=$TASK_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$TASK_COUNT" -gt 0 ]; then
            echo "Hay $TASK_COUNT tarea(s) asistida(s) en el informe; sus recursos publicados se conservan. Los audios y PPT validados pueden actualizarse." >> "$GITHUB_STEP_SUMMARY"
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No se detectaron cambios de recursos." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar recursos validados en main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$AUTOMATION_BASE_SHA" ]; then
            echo "main cambió durante la revisión; volver a ejecutar sobre la nueva versión." >&2
            exit 1
          fi
          git add src/data/quarters public/resource-manifest.json public/recursos
          if ! git diff --cached --quiet; then
            git commit -m "chore(resources): actualización automática de recursos"
            # A normal fast-forward push also rejects a concurrent update to main.
            git push origin HEAD:refs/heads/main
            echo "Recursos validados publicados en main: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Registrar tareas asistidas para un agente
        if: steps.changes.outputs.tasks != '' && steps.changes.outputs.tasks != '0'
        shell: bash
        env:
          TASK_COUNT: ${{ steps.changes.outputs.tasks }}
        run: |
          echo "### Tareas asistidas pendientes ($TASK_COUNT)" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open(os.environ["RESOURCE_REPORT"], encoding="utf-8") as report_file:
              report = json.load(report_file)
          for task in report.get("tasks", []):
              print(f"- Lección {task['lessonNumber']}: {task['kind']} ({task['reason']}). Fuente: {task['sourceUrl']}")
          print("\nLas lecturas publicadas se mantienen hasta su revisión editorial. El informe completo está en el artefacto resource-update-report.")
          PY
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')" != "true" ]; then
            echo "Incidencias desactivadas: las tareas quedan registradas en este resumen y en el informe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TITLE="content(resources): tareas asistidas pendientes"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY_FILE=$(mktemp)
          printf '%s\n' \
            "El actualizador encontró $TASK_COUNT tarea(s) que requieren un agente compatible." \
            '' \
            "Informe: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (artefacto resource-update-report)." \
            '' \
            'Seguir `.agents/workflows/actualizar-recursos-semanales.md` y volver a ejecutar el ciclo.' > "$BODY_FILE"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          else
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
          fi

      - name: Esperar Vercel y comprobar producción
        run: >-
          python3 scripts/verify_deployment.py
          --base-url https://escuelasabatica.cl
          --attempts 45
          --interval 20
          --timeout 20
          --workers 8
