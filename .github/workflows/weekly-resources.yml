name: Actualización semanal de recursos

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-resources
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESOURCE_REPORT: /tmp/resource-update-report.json
      AUTOMATION_BRANCH: automation/weekly-resources-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Reestructurar, importar, actualizar, auditar y compilar
        run: npm run resources:sync -- --report "$RESOURCE_REPORT" --no-install

      - name: Guardar informe de ejecución
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-update-report
          path: ${{ env.RESOURCE_REPORT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Detectar cambios reales
        id: changes
        shell: bash
        run: |
          TASK_COUNT=$(python3 -c 'import json, os; print(len(json.load(open(os.environ["RESOURCE_REPORT"], encoding="utf-8")).get("tasks", [])))')
          echo "tasks=$TASK_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$TASK_COUNT" -gt 0 ]; then
            echo "Hay $TASK_COUNT tarea(s) asistida(s); no se autoriza una publicación desatendida." >> "$GITHUB_STEP_SUMMARY"
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No se detectaron cambios de recursos." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Crear commit y actualizar rama automática
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "escuela-sabatica-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$AUTOMATION_BRANCH"
          git add src/data/quarters public/resource-manifest.json public/recursos
          git commit -m "chore(resources): actualización semanal automática"
          git push origin "HEAD:refs/heads/$AUTOMATION_BRANCH"

      - name: Crear o actualizar pull request
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        env:
          TASK_COUNT: ${{ steps.changes.outputs.tasks }}
        shell: bash
        run: |
          BODY=$(printf '%s\n' \
            'Actualización generada por el verificador semanal de recursos.' \
            '' \
            '- Descargas validadas por tipo, tamaño y checksum.' \
            '- Las tareas no deterministas quedan en cola para una persona o cualquier agente compatible.' \
            '- Se procesó la bandeja manual y se comprobó la estructura canónica.' \
            '- Catálogo y manifiesto auditados.' \
            '- `npm run resources:test` completado dentro del pipeline.' \
            '- `npm run build` completado antes de abrir este PR.' \
            '- Las rutas locales del sitio construido fueron auditadas.' \
            '' \
            'Revisar el informe adjunto a la ejecución antes de fusionar.')
          DRAFT_ARGS=()
          if [ "$TASK_COUNT" -gt 0 ]; then
            DRAFT_ARGS+=(--draft)
          fi
          PR_URL=$(gh pr create \
            --base main \
            --head "$AUTOMATION_BRANCH" \
            --title "chore(resources): actualización semanal" \
            --body "$BODY" \
            "${DRAFT_ARGS[@]}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR creado: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Fusionar actualización completamente validada
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.tasks == '0'
        shell: bash
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          MERGED=false
          for attempt in $(seq 1 80); do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "El PR se cerró sin fusionarse." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 15
          done
          if [ "$MERGED" != "true" ]; then
            echo "La fusión no terminó. Configure AUTOMATION_GITHUB_TOKEN y revise las reglas de main." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PR fusionado automáticamente después de todas las validaciones." >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar tareas asistidas para un agente
        if: steps.changes.outputs.tasks != '0'
        shell: bash
        env:
          TASK_COUNT: ${{ steps.changes.outputs.tasks }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          TITLE="content(resources): tareas asistidas pendientes"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "El actualizador encontró $TASK_COUNT tarea(s) que requieren un agente compatible." \
            '' \
            "PR borrador: ${PR_URL:-sin cambios publicables}" \
            "Informe: resource-update-report (artefacto de esta ejecución)." \
            '' \
            'Seguir `.agents/workflows/actualizar-recursos-semanales.md` y volver a ejecutar el ciclo.')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue edit "$EXISTING" --body "$BODY"
          fi
          echo "La publicación se detuvo hasta que un agente complete las tareas asistidas." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Esperar Vercel y comprobar producción
        if: steps.changes.outputs.tasks == '0'
        run: >-
          python3 scripts/verify_deployment.py
          --base-url https://escuelasabatica.cl
          --attempts 45
          --interval 20
          --timeout 20
          --workers 8
